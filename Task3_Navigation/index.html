<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Navigation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Menu -->

    <nav>
        <h2>MyWebsite</h2>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>


    <!-- Home Section -->

    <section id="home">
        <h1>Home</h1>
        <p>Welcome to my website.</p>
    </section>


    <!-- About Section -->

    <section id="about">
        <h1>About</h1>
        <p>This is the About section.</p>
    </section>


    <!-- Services Section -->

    <section id="services">
        <h1>Services</h1>
        <p>This is the Services section.</p>
    </section>


    <!-- Contact Section -->

    <section id="contact">
        <h1>Contact</h1>
        <p>This is the Contact section.</p>
    </section>

</body>

</html>
